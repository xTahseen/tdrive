version: "3.9"

services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - TEMP_DIR=/app/downloads
    ports:
      - "${WEBUI_PORT:-8080}:${WEBUI_PORT:-8080}"
    volumes:
      - ./downloads:/app/downloads
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
